#==============================================#
# Thwomp by RedSMURF: Configuration file #
#==============================================#

# To add a new Thwomp, follow the example below
# [Thwomp Name]
# THWOMP_FLAGS                    = a - Active Delay     b - Active Duration     c - Shake
# THWOMP_TEAM                     = 0 - None             1 - Terrorist           2 - Counter-Terrorist      3 - Both

# THWOMP_SPAWN_CHANCE             = Thwomp's respawn probability (0.0 = never, 1.0 = always)
# THWOMP_ACTIVE_DELAY             = Delay in seconds before the Thwomp becomes active at round start
# THWOMP_ACTIVE_DURATION          = Duration of the active state in seconds
# THWOMP_ACTIVE_COOLDOWN          = Cooldown in seconds before the Thwomp becomes active again
# THWOMP_FALL_STRENGTH            = Strength of the Thwomp's fall (higher value = faster fall)
# THWOMP_FALL_FREQ                = Frequency of the Thwomp's fall (lower value = more frequent falls)
# THWOMP_IDLE_DURATION            = Duration of the idle state in seconds
# THWOMP_RAISE_STRENGTH           = Strength of the Thwomp's raise (higher value = faster raise)
# THWOMP_COOLDOWN                 = Cooldown in seconds before the Thwomp can be activated again
# THWOMP_SHAKE_DISTANCE           = Distance in units for the shake effect
# THWOMP_SHAKE_AMPLITUDE          = Amplitude of the shake effect
# THWOMP_SHAKE_FREQUENCY          = Frequency of the shake effect
# THWOMP_SHAKE_DURATION           = Duration of the shake effect in seconds
# THWOMP_SOUND_ALERT              = Sound played when the Thwomp is about to fall
# THWOMP_SOUND_SMASH              = Sound played when the Thwomp hits the ground

# To make a Thwomp available in the menu, you must defined at least it's name like this [RedSMURF's Thwomp]
# Thwomp model and sound cannot be changed dynamically during gameplay

